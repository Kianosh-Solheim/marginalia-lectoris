name: Companion app

# Builds Marginalia Companion (the computer helper that syncs an audiobook with its text) for Linux, Windows and
# macOS, after checking that its sentence matcher gives the same map as the web view's. A tag companion-v* also
# publishes the three builds as a release.
on:
  push:
    branches: [main]
    paths: ['companion/**', 'app/src/main/assets/web/audiobook.js', '.github/workflows/companion.yml']
    tags: ['companion-v*']
  pull_request:
    paths: ['companion/**', 'app/src/main/assets/web/audiobook.js', '.github/workflows/companion.yml']
  workflow_dispatch:
    inputs:
      version:
        description: 'Publish as a release, e.g. 1.0 (empty: only build)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Same map as the web view
        run: python3 companion/tests/parity.py

  build:
    needs: parity
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: companion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install
        env:
          EXTRA: ${{ matrix.extra }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          if [ -n "$EXTRA" ]; then python -m pip install $EXTRA; fi
      - name: Build
        run: |
          # This build's version and variant, for the app's own update check.
          V="${{ inputs.version }}"; if [ -z "$V" ]; then case "$GITHUB_REF_NAME" in companion-v*) V="${GITHUB_REF_NAME#companion-v}";; *) V="0-dev-${GITHUB_SHA::7}";; esac; fi
          printf '{"version": "%s", "variant": "%s"}' "$V" "${{ matrix.name }}" > build_info.json
          cat build_info.json
          echo "COMPANION_VERSION=$V" >> "$GITHUB_ENV"
          # The app's icon (the tray icon, large), for Windows (.ico) and the Mac (.png, converted by PyInstaller).
          python -c "import tray_icon; im = tray_icon.image(None, size=256); im.save('icon.png'); im.save('icon.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"
          if [ "${{ matrix.name }}" = windows ]; then icon=icon.ico; else icon=icon.png; fi
          python -m PyInstaller --noconfirm --onedir --windowed --name "Marginalia Companion" \
            --add-data "build_info.json:." \
            --hidden-import core --hidden-import daemon --hidden-import window --hidden-import store --hidden-import autostart \
            --hidden-import nvidia --hidden-import tray_icon --hidden-import updater --hidden-import align \
            --collect-submodules pystray --collect-all faster_whisper --collect-all ctranslate2 --collect-all onnxruntime --collect-all av \
            --osx-bundle-identifier no.marginalia.companion --icon "$icon" \
            marginalia_companion.py
          if [ "${{ matrix.name }}" = macos ]; then
            # Lives in the menu bar, without a Dock icon; then signed again (ad hoc), as the change breaks the signature.
            app="dist/Marginalia Companion.app"
            plutil -insert LSUIElement -bool true "$app/Contents/Info.plist"
            codesign --force --deep --sign - "$app"
          fi
      - name: Self-test the build (matcher, audio decoder, speech engine)
        timeout-minutes: 15
        env:
          # ctranslate2 and onnxruntime each bring an OpenMP library; on macOS two copies can stall.
          KMP_DUPLICATE_LIB_OK: 'TRUE'
          PYTHONUNBUFFERED: '1'
        run: |
          case "${{ matrix.name }}" in
            macos) exe="dist/Marginalia Companion.app/Contents/MacOS/Marginalia Companion" ;;
            windows) exe="dist/Marginalia Companion/Marginalia Companion.exe" ;;
            *) exe="dist/Marginalia Companion/Marginalia Companion" ;;
          esac
          "$exe" --self-test
      - name: Windows installer (Inno Setup), and a quiet test install
        if: matrix.name == 'windows'
        run: |
          iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if [ ! -x "$iscc" ]; then choco install innosetup --no-progress -y >/dev/null; fi
          "$iscc" //Q installer.iss
          ls -la Marginalia-Companion-windows-setup.exe
          ./Marginalia-Companion-windows-setup.exe //VERYSILENT //SUPPRESSMSGBOXES //NORESTART
          sleep 5
          installed="$LOCALAPPDATA/Programs/Marginalia Companion/Marginalia Companion.exe"
          ls -la "$installed"
          "$installed" --version
      - name: Pack
        run: |
          cd dist
          if [ "${{ matrix.name }}" = windows ]; then 7z a -tzip "../Marginalia-Companion-windows.zip" "Marginalia Companion" >/dev/null
            # Same app under the old NVIDIA name, so 1.0.1's NVIDIA build finds its update (graphics support is now a download in the app).
            cp ../Marginalia-Companion-windows.zip ../Marginalia-Companion-windows-nvidia.zip
          elif [ "${{ matrix.name }}" = macos ]; then
            ditto -c -k --keepParent "Marginalia Companion.app" "../Marginalia-Companion-${{ matrix.name }}.zip"
            # A disk image to drag the app into Applications.
            mkdir dmg && cp -R "Marginalia Companion.app" dmg/ && ln -s /Applications dmg/Applications
            hdiutil create -volname "Marginalia Companion" -srcfolder dmg -ov -format UDZO "../Marginalia-Companion-macos.dmg"
          else tar czf "../Marginalia-Companion-${{ matrix.name }}.tar.gz" "Marginalia Companion"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: Marginalia-Companion-${{ matrix.name }}
          path: companion/Marginalia-Companion-*

  release:
    if: startsWith(github.ref, 'refs/tags/companion-v') || inputs.version != ''
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A pre-release that is never "latest", so Obtainium on the tablet keeps following the app's own releases.
          TAG="${GITHUB_REF_NAME}"
          if [ -n "${{ inputs.version }}" ]; then TAG="companion-v${{ inputs.version }}"; fi
          gh release create "$TAG" out/* --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" --prerelease --latest=false \
            --title "Marginalia Companion ${TAG#companion-v}" \
            --notes "Syncs an audiobook with its book's text on a computer. Windows: run Marginalia-Companion-windows-setup.exe (no administrator needed). Mac (Apple Silicon): open the .dmg and drag the app into Applications. Linux: unpack the .tar.gz and open Marginalia Companion; it adds itself to the program menu. The .zip files are for the app's own updates. See companion/README.md."

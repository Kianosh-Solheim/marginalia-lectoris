# Builds Marginalia Lectoris on GitHub and publishes the APK as a release, so Obtainium on the
# tablet can find and install each new version.
#
# Runs when you push to main (a new release each time), or by hand from the Actions tab.
# Needs three repository secrets (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64  – the release key (.jks), base64-encoded
#   STORE_PASSWORD   – the key store password
#   KEY_PASSWORD     – the key password
name: Build and release

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write   # to create the release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Ubuntu 24.04 images come with the Android SDK; Gradle fetches the platform it needs.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          test -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" || { echo "::error::No Android SDK on this runner"; exit 1; }
          yes | "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Speech recognition source (whisper.cpp, MIT)
        run: git clone --quiet --depth 1 --branch v1.9.4 https://github.com/ggml-org/whisper.cpp app/src/main/cpp/whisper.cpp

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.3.1'

      - name: Version for this build
        id: ver
        run: |
          echo "code=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"
          echo "name=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Restore the release key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No KEYSTORE_BASE64 secret yet: building an unsigned test APK, no release."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          APP_VERSION_CODE: ${{ steps.ver.outputs.code }}
          APP_VERSION_NAME: ${{ steps.ver.outputs.name }}
        run: |
          set -o pipefail
          gradle --no-configuration-cache :app:assembleRelease 2>&1 | tee build.log || {
            # Compiler errors as annotations, so they can be read without the full log.
            grep -E '^e: |error:|What went wrong' -A2 build.log | head -40 | while IFS= read -r line; do echo "::error::${line}"; done
            exit 1
          }

      - name: Name the APK
        if: steps.key.outputs.signed == 'true'
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$apk" "MarginaliaLectoris-${{ steps.ver.outputs.name }}.apk"

      - name: Keep the unsigned test APK
        if: steps.key.outputs.signed != 'true'
        uses: actions/upload-artifact@v5
        with:
          name: unsigned-test-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish the release
        if: steps.key.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.ver.outputs.name }}" \
            "MarginaliaLectoris-${{ steps.ver.outputs.name }}.apk" \
            --title "Marginalia Lectoris ${{ steps.ver.outputs.name }}" \
            --notes "$(git log -1 --pretty=%B)"

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

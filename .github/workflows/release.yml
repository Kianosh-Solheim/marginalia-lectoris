# Builds Marginalia Lectoris on GitHub and publishes the APK as a release, so Obtainium on the
# tablet can find and install each new version.
#
# Runs when you push to main (a new release each time), or by hand from the Actions tab.
# Needs three repository secrets (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64  – the release key (.jks), base64-encoded
#   STORE_PASSWORD   – the key store password
#   KEY_PASSWORD     – the key password
name: Build and release

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write   # to create the release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Version for this build
        id: ver
        run: |
          echo "code=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"
          echo "name=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Restore the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::The KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build the release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          APP_VERSION_CODE: ${{ steps.ver.outputs.code }}
          APP_VERSION_NAME: ${{ steps.ver.outputs.name }}
        run: gradle --no-configuration-cache :app:assembleRelease

      - name: Name the APK
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$apk" "MarginaliaLectoris-${{ steps.ver.outputs.name }}.apk"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.ver.outputs.name }}" \
            "MarginaliaLectoris-${{ steps.ver.outputs.name }}.apk" \
            --title "Marginalia Lectoris ${{ steps.ver.outputs.name }}" \
            --notes "$(git log -1 --pretty=%B)"

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
